<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:linear-gradient(
                135deg,
                #d71920,
                #a50000
            );
            min-height:100vh;
        }

        /* ===================
        NAVBAR
        =================== */

        .navbar{
            background:#b30000;
        }

        .custom-navbar{
            background: #b30000;
            padding: 10px 0;
        }

        .navbar-brand{
            font-size: 15px;
            font-weight: 600;
        }

        .navbar-nav .nav-link{
            color: white !important;
            font-size: 14px;
            margin: 0 8px;
            transition: .3s;
        }

        .navbar-nav .nav-link:hover{
            color: #ffd54f !important;
        }

        .dropdown-menu{
            border: none;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,.15);
        }

        .dropdown-item{
            font-size: 14px;
            padding: 10px 15px;
        }

        .dropdown-item:hover{
            background: #b30000;
            color: white;
        }

        .profile-icon{
            color: white;
            font-size: 14px;
            text-decoration: none;
        }

        .profile-icon:hover{
            color: #ffd54f;
        }

        /* Mobile */
        @media (max-width: 991px){

            .navbar-collapse{
                background: #b30000;
                padding: 15px;
                margin-top: 10px;
                border-radius: 10px;
            }

            .navbar-nav{
                text-align: center;
            }

            .profile-icon{
                display: flex;
                justify-content: center;
                margin-top: 10px;
            }
        }

        /* ===================
        HERO
        =================== */

        .hero-section{
            background:#f0a816;
            min-height:400px;
            display:flex;
            align-items:center;
            padding-top:90px;
        }

        .hero-section h1{
            color:white;
            font-family:'Luckiest Guy', cursive;
            font-size:5rem;
            line-height:1.1;
            margin-top:20px;
        }

        .hero-image{
            max-width:320px;
        }

        /* ===================
        CARD CABANG
        =================== */

        .cabang-section{
            padding:60px 0;
        }

        .cabang-card{
            background:#e7d3b4;
            height:220px;

            border-radius:10px;

            display:flex;
            align-items:center;
            justify-content:center;

            position:relative;

            cursor:pointer;

            transition:.3s;
        }

        .cabang-card.active{
            background:#f0a816;
        }

        .cabang-card:hover{
            transform:translateY(-8px);
        }

        .nomor{
            position:absolute;
            top:0;
            left:0;

            width:65px;
            height:65px;

            border-right:6px solid #000;
            border-bottom:6px solid #000;

            border-radius:0 0 100% 0;

            display:flex;
            align-items:center;
            justify-content:center;

            font-size:2rem;
            font-weight:700;
        }

        .cabang-card h3{
            font-weight:700;
            text-align:center;
            line-height:1.3;
        }

       .cabang-card a,
        .cabang-card a:hover,
        .cabang-card a:focus,
        .cabang-card a:visited{
            text-decoration: none;
            color: black;
        }

        .cabang-link{
            text-decoration: none;
            color: inherit;
        }

        /* ================= FOOTER ================= */
        footer {
            text-align: center;
            padding: 20px;
            color: #5c3b00;
            font-size: 12px;
            background: #F9B818;
            border-top: 1px solid #f0c33c;
        }

        /* ===================
        TABLET
        =================== */

        @media (max-width: 992px) {
            .hero-section h1 {
                font-size: 3rem;
                text-align: center;
                line-height: 1.1;
            }

            .hero-image {
                margin-top: 25px;
            }
        }

        /* ===================
        MOBILE
        =================== */

        @media (max-width: 576px) {
            .hero-section {
                padding: 55px 0 35px;
            }

            .hero-section h1 {
                font-size: 2.2rem;
                text-align: center;
                line-height: 1.1;
                margin-bottom: 0;
            }

            .hero-image {
                width: 200px;
                margin-top: 15px;
            }

            .cabang-card {
                height: 170px;
            }

            .nomor {
                width: 55px;
                height: 55px;
                font-size: 1.5rem;
            }

            .cabang-card h3 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

        </div>
    </nav>
