         FONT AWESOME

         GOOGLE FONT

    <!-- =====================================================
         STYLE
    ====================================================== -->

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }


        body {

            background:
                linear-gradient(
                    135deg,
                    #d82323,
                    #8b0000
                );

            min-height: 100vh;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {

            background: #b30000;
        }


        .custom-navbar {

            background: #b30000;

            padding: 10px 0;
        }


        .navbar-brand {

            font-size: 15px;

            font-weight: 600;
        }


        .navbar-nav .nav-link {

            color: white !important;

            font-size: 14px;

            margin: 0 8px;

            transition: .3s;
        }


        .navbar-nav .nav-link:hover {

            color: #ffd54f !important;
        }


        .dropdown-menu {

            border: none;

            border-radius: 10px;

            box-shadow:
                0 5px 20px rgba(0,0,0,.15);
        }


        .dropdown-item {

            font-size: 14px;

            padding: 10px 15px;
        }


        .dropdown-item:hover {

            background: #b30000;

            color: white;
        }


        .profile-icon {

            color: white;

            font-size: 14px;

            text-decoration: none;
        }


        .profile-icon:hover {

            color: #ffd54f;
        }


        @media (max-width: 991px) {

            .navbar-collapse {

                background: #b30000;

                padding: 15px;

                margin-top: 10px;

                border-radius: 10px;
            }


            .navbar-nav {

                text-align: center;
            }


            .profile-icon {

                display: flex;

                justify-content: center;

                margin-top: 10px;
            }

        }


        /* =========================
           SECTION
        ========================= */

        .presensi-section {

            min-height: 100vh;

            padding-top: 100px;

            padding-bottom: 40px;

            background:
                linear-gradient(
                    135deg,
                    #e53935,
                    #a80000
                );

            display: flex;

            align-items: center;
        }


        /* =========================
           CARD
        ========================= */

        .card-presensi {

            background: white;

            border-radius: 8px;

            padding: 20px;

            min-height: 320px;

            box-shadow:
                0 4px 15px rgba(0,0,0,.15);
        }


        /* =========================
           BUTTON
        ========================= */

        .btn-masuk {

            background: #f4c542;

            color: #000;

            font-weight: 600;

            min-width: 120px;

            border: none;
        }


        .btn-masuk:hover {

            background: #e0b637;

            color: #000;
        }


        .btn-masuk:disabled {

            opacity: .6;

            cursor: not-allowed;
        }


        /* =========================
           MAP
        ========================= */

        #map {

            width: 100%;

            height: 250px;

            border-radius: 8px;
        }


        /* =========================
           KAMERA
        ========================= */

        .kamera-box {

            width: 100%;

            height: 250px;

            background: #d9d9d9;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 22px;

            border-radius: 8px;

            overflow: hidden;

            position: relative;
        }


        #video {

            width: 100%;

            height: 100%;

            object-fit: cover;

            border-radius: 8px;

            display: none;
        }


        #previewFoto {

            width: 100%;

            height: 100%;

            object-fit: cover;

            border-radius: 8px;

            display: none;
        }


        #canvas {

            display: none;
        }


        #kameraPlaceholder {

            color: #555;
        }


        /* =========================
           INFO
        ========================= */

        .info-presensi {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-top: 20px;

            flex-wrap: wrap;

            gap: 10px;

            font-size: 18px;
        }


        #statusLokasi {

            line-height: 1.8;
        }


        /* =========================
           STATUS ABSENSI
        ========================= */

        #statusAbsensi {

            font-size: 14px;
        }

        /* ================= FOOTER ================= */
        footer {
            text-align: center;
            padding: 20px;
            color: #5c3b00;
            font-size: 12px;
            background: #F9B818;
            border-top: 1px solid #f0c33c;
        }


        /* =========================
           MOBILE
        ========================= */

        @media(max-width:768px) {

            .card-presensi {

                min-height: auto;
            }


            .info-presensi {

                flex-direction: column;

                text-align: center;
            }

        }


        @media(max-width:576px) {

            h5 {

                text-align: left;
            }


            .kamera-box {

                height: 250px;
            }


            .btn-masuk {

                width: 100%;

                margin-bottom: 5px;
            }


            .info-presensi {

                font-size: 16px;
            }

        }

    </style>

</head>

====================================================== -->

<div class="container-fluid presensi-section">


    <div class="container py-4">


        <h5 class="text-white mb-4">

            Presensi Pulang

        </h5>


        <div class="row g-4">


            <!-- =================================================
                 CARD LOKASI
            ================================================== -->

                    </div>

                            type="button"
                            id="btnKamera"
                            class="btn btn-masuk"
                        >

                            <i class="fa-solid fa-camera"></i>

                            Buka Kamera

                        </button>


                        <!-- AMBIL FOTO -->

                        <button
                            type="button"
                            id="btnFoto"
                            class="btn btn-masuk"
                            style="display:none;"
                        >

                            type="button"

<!-- =====================================================
     JAM & TANGGAL
====================================================== -->

<script>

function updateDateTime() {

    const now = new Date();


    const tanggalOptions = {

        day: 'numeric',

        month: 'long',

        year: 'numeric'

    };


    document.getElementById('tanggal').innerHTML =

        now.toLocaleDateString(
            'id-ID',
            tanggalOptions
        );


    const jam =
        String(
            now.getHours()
        ).padStart(2, '0');


    const menit =
        String(
            now.getMinutes()
        ).padStart(2, '0');


    const detik =
        String(
            now.getSeconds()
        ).padStart(2, '0');


    document.getElementById('jam').innerHTML =

        `${jam} : ${menit} : ${detik}`;

}


updateDateTime();


setInterval(
    updateDateTime,
    1000
);

</script>
