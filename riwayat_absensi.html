    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }


        body{
            overflow-x:hidden;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar{
            background:#b30000;
        }


        .custom-navbar{
            background:#b30000;
            padding:10px 0;
        }


        .navbar-brand{
            font-size:15px;
            font-weight:600;
        }


        .navbar-brand img{
            object-fit:contain;
        }


        .navbar-nav .nav-link{
            color:white !important;
            font-size:14px;
            margin:0 8px;
            transition:.3s;
        }


        .navbar-nav .nav-link:hover{
            color:#ffd54f !important;
        }


        .dropdown-menu{
            border:none;
            border-radius:10px;
            box-shadow:0 5px 20px rgba(0,0,0,.15);
        }


        .dropdown-item{
            font-size:14px;
            padding:10px 15px;
        }


        .dropdown-item:hover{
            background:#b30000;
            color:white;
        }


        .profile-icon{
            color:white;
            font-size:14px;
            text-decoration:none;
        }


        .profile-icon:hover{
            color:#ffd54f;
        }


        /* =========================
           MAIN
        ========================= */

        .rekap-section{

            min-height:100vh;

            padding-top:150px;
            padding-bottom:70px;

            background:
                linear-gradient(
                    135deg,
                    #d62828,
                    #8b0000
                );
        }


        /* =========================
           HEADER
        ========================= */

        .header-rekap{

            display:flex;

            justify-content:space-between;

            align-items:center;

            margin-bottom:35px;

            gap:20px;
        }


        .judul{

            color:white;

            font-size:42px;

            font-weight:700;

            margin:0;

            line-height:1.2;
        }


        .tanggal-sekarang{

            color:#ffe6e6;

            font-size:14px;

            margin-top:5px;

            margin-bottom:0;
        }


        /* =========================
           FILTER
        ========================= */

        .filter-box{

            background:rgba(255,255,255,.08);

            padding:0;

            border-radius:15px;

            backdrop-filter:blur(10px);
        }


        .form-label{

            color:white;

            font-size:15px;

            font-weight:500;

            margin-bottom:8px;
        }


        .tanggal{

            height:64px;

            border-radius:12px;

            border:2px solid rgba(255,255,255,.4);

            padding:0 18px;

            font-size:15px;

            box-shadow:0 5px 15px rgba(0,0,0,.08);
        }


        .tanggal:focus{

            border-color:#ffc107;

            box-shadow:
                0 0 0 .2rem
                rgba(255,193,7,.2);
        }


        /* =========================
           BUTTON EXPORT
        ========================= */

        .btn-export{

            background:#ffc107;

            color:#000;

            font-weight:600;

            height:62px;

            padding:0 25px;

            border:none;

            border-radius:13px;

            box-shadow:
                0 5px 15px
                rgba(0,0,0,.15);

            transition:.2s;
        }


        .btn-export:hover{

            transform:translateY(-2px);

            background:#ffb300;

            color:#000;
        }


        /* =========================
           BUTTON TAMPILKAN
        ========================= */

        .btn-tampil{

            background:#ffc107;

            color:#000;

            height:64px;

            border:none;

            border-radius:12px;

            font-weight:600;

            font-size:15px;

            transition:.2s;

            box-shadow:
                0 5px 15px
                rgba(0,0,0,.12);
        }


        .btn-tampil:hover{

            background:#ffb300;

            color:#000;

            transform:translateY(-2px);
        }


        /* =========================================================
   TABLE RIWAYAT ABSENSI
========================================================= */

.table-wrapper{

    width:100%;

    background:white;

    border-radius:20px;

    overflow:hidden;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.20);

    margin-top:30px;
}


.custom-table{

    width:100%;

    table-layout:fixed;

    margin:0;

    background:white;

    border-collapse:collapse;
}


/* HEADER */

.custom-table thead th{

    background:#b30000;

    color:white;

    text-align:center;

    vertical-align:middle;

    padding:17px 10px;

    border:none;

    font-size:14px;

    font-weight:600;

    white-space:nowrap;
}


/* BODY */

.custom-table tbody td{

    text-align:center;

    vertical-align:middle;

    padding:16px 10px;

    border-bottom:
        1px solid #eeeeee;

    font-size:13px;

    color:#333;

    word-wrap:break-word;

}


/* HOVER */

.custom-table tbody tr{

    transition:.2s ease;
}


.custom-table tbody tr:hover{

    background:#fff6f6;
}


.custom-table tbody tr:last-child td{

    border-bottom:none;
}


/* =========================================================
   LEBAR MASING-MASING KOLOM
========================================================= */

.custom-table th:nth-child(1),
.custom-table td:nth-child(1){

    width:7%;
}


.custom-table th:nth-child(2),
.custom-table td:nth-child(2){

    width:20%;
}


.custom-table th:nth-child(3),
.custom-table td:nth-child(3){

    width:15%;
}


.custom-table th:nth-child(4),
.custom-table td:nth-child(4){

    width:15%;
}


.custom-table th:nth-child(5),
.custom-table td:nth-child(5){

    width:20%;
}


.custom-table th:nth-child(6),
.custom-table td:nth-child(6){

    width:23%;
}


/* =========================================================
   KOLOM NO
========================================================= */

.kolom-no{

    font-weight:600;

    color:#555;
}


/* =========================================================
   TANGGAL
========================================================= */

.kolom-tanggal{

    font-weight:500;

    white-space:nowrap;
}


/* =========================================================
   JAM
========================================================= */

.kolom-jam{

    font-weight:600;

    color:#333;

    white-space:nowrap;
}


/* =========================================================
   CABANG
========================================================= */

.kolom-cabang{

    font-weight:500;

    color:#444;
}


.kolom-cabang i{

    color:#b30000;

    margin-right:5px;
}


/* =========================================================
   KETERANGAN
========================================================= */

.kolom-keterangan{

    text-align:center;
}


/* HADIR */

.badge-hadir{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:5px;

    background:#d1fae5;

    color:#047857;

    padding:7px 13px;

    border-radius:20px;

    font-size:12px;

    font-weight:600;

    white-space:nowrap;
}


/* TERLAMBAT */

.badge-terlambat{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:5px;

    background:#fff3cd;

    color:#856404;

    padding:7px 13px;

    border-radius:20px;

    font-size:12px;

    font-weight:600;

    white-space:nowrap;
}


/* BELUM */

.badge-belum{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:5px;

    background:#fff3cd;

    color:#856404;

    padding:7px 13px;

    border-radius:20px;

    font-size:12px;

    font-weight:600;

    white-space:nowrap;
}


/* TIDAK */

.badge-tidak{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:5px;

    background:#fee2e2;

    color:#b91c1c;

    padding:7px 13px;

    border-radius:20px;

    font-size:12px;

    font-weight:600;

    white-space:nowrap;
}


.keterangan-text{

    font-weight:500;

    color:#555;
}


/* =========================================================
   LOADING
========================================================= */

.loading-data{

    text-align:center !important;

    padding:25px !important;

    color:#777 !important;
}


.loading-data i{

    color:#b30000;

    margin-right:7px;
}


/* =========================================================
   DATA KOSONG
========================================================= */

.empty-data{

    text-align:center !important;

    padding:30px !important;

    color:#777 !important;
}


.empty-data i{

    font-size:18px;

    margin-right:7px;
}


/* =========================================================
   ERROR
========================================================= */

.error-data{

    text-align:center !important;

    padding:25px !important;

    color:#dc3545 !important;
}


/* =========================================================
   STATUS
========================================================= */

#statusRiwayat{

    color:#ffecec;

    font-size:13px;

    margin-bottom:10px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:768px){

    .table-wrapper{

        overflow-x:auto;

        border-radius:15px;
    }


    .custom-table{

        min-width:800px;

        table-layout:fixed;
    }


    .custom-table thead th{

        font-size:12px;

        padding:13px 8px;
    }


    .custom-table tbody td{

        font-size:12px;

        padding:13px 8px;
    }

}

/* ================= FOOTER ================= */
        footer {
            text-align: center;
            padding: 20px;
            color: #5c3b00;
            font-size: 12px;
            background: #F9B818;
            border-top: 1px solid #f0c33c;
        }


        /* =========================
           MOBILE
        ========================= */

        @media(max-width:991px){

            .navbar-collapse{

                background:#b30000;

                padding:15px;

                margin-top:10px;

                border-radius:10px;
            }


            .navbar-nav{

                text-align:center;
            }


            .profile-icon{

                display:flex;

                justify-content:center;

                margin-top:10px;
            }

        }


        @media(max-width:768px){

            .rekap-section{

                padding-top:110px;

                padding-bottom:50px;
            }


            .header-rekap{

                flex-direction:column;

                align-items:flex-start;
            }


            .judul{

                font-size:30px;
            }


            .btn-export{

                width:100%;
            }


            .table-wrapper{

                border-radius:15px;
            }


            .custom-table thead th{

                font-size:12px;

                padding:12px 8px;
            }


            .custom-table tbody td{

                font-size:12px;

                padding:12px 8px;
            }

        }


        @media(max-width:576px){

            .judul{

                font-size:27px;
            }


            .tanggal{

                height:55px;
            }


            .btn-tampil{

                height:55px;
            }


            .btn-export{

                height:55px;
            }

        }

    </style>

            <!-- HEADER -->

                <div>

                    <h3 class="judul">

                        📋 Rekap Presensi

                    </h3>


                    <p
                        class="tanggal-sekarang"
                        id="tanggalRealtime"
                    ></p>

                </div>


                <div>

                    <button
                        type="button"
                        class="btn btn-export"
                        onclick="exportExcel()"
                    >

                        📊 Export Excel

                    </button>

                </div>


            </div>



            <!-- FILTER -->

            <div class="row g-3 align-items-end">


                <div class="col-md-4">

                    <label
                        class="form-label"
                        for="tanggalMulai"
                    >
                        Tanggal Mulai
                    </label>


                    <input
                        type="date"
                        id="tanggalMulai"
                        class="form-control tanggal"
                    >

                </div>



                <div class="col-md-4">

                    <label
                        class="form-label"
                        for="tanggalAkhir"
                    >
                        Tanggal Akhir
                    </label>


                    <input
                        type="date"
                        id="tanggalAkhir"
                        class="form-control tanggal"
                    >

                </div>



                <div class="col-md-2">

                    <button
                        type="button"
                        class="btn btn-tampil w-100"
                        onclick="tampilkanRiwayat()"
                    >

                </div>


            </div>

                class="mt-3"
            ></div>

                class="table-wrapper table-responsive"
            >

                    id="tabelAbsensi"
                    class="table custom-table align-middle"
                >

                            <th>No</th>

                            <th>Tanggal</th>

                            <th>Jam Masuk</th>

                            <th>Jam Pulang</th>

                            <th>Keterangan</th>

                            <th>Cabang</th>

                        </tr>

                    </thead>


                    <tbody
                        id="tabelAbsensiBody"
                    >

                    </tbody>

    <!-- =========================
         MAP
    ========================= -->

    <script>

        var map =
            L.map('map').setView(
                [-7.45, 112.73],
                12
            );


        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution:
                    '&copy; OpenStreetMap'
            }
        ).addTo(map);


        /* Sepande */

        L.marker(
            [-7.470, 112.720]
        )
        .addTo(map)
        .bindPopup(`
            <b>Dimsum Hokya Sepande</b><br>
            Jl. Raya Sepande No.33,
            Kauman, Sepande, Candi
        `);


        /* Bluru */

        L.marker(
            [-7.451247, 112.736069]
        )
        .addTo(map)
        .bindPopup(`
            <b>Dimsum Hokya Bluru</b><br>
            Bluru Kidul, Sidoarjo
        `);


        /* Tulangan */

        L.marker(
            [-7.496, 112.652]
        )
        .addTo(map)
        .bindPopup(`
            <b>Dimsum Hokya Tulangan</b><br>
            Jl. Raya Kenongo No.24,
            Kenongo, Tulangan
        `);

    </script>



    <!-- =========================
         TANGGAL REALTIME
    ========================= -->

    <script>

        function updateTanggal(){

            const sekarang =
                new Date();


            const opsi = {

                weekday:'long',

                day:'numeric',

                month:'long',

                year:'numeric'

            };


            document.getElementById(
                "tanggalRealtime"
            ).innerHTML =
                sekarang.toLocaleDateString(
                    'id-ID',
                    opsi
                );

        }


        updateTanggal();

    </script>
